<%#
Integrated status card: toggle, interface info, auth state, action buttons.
-%>

<div class="cbi-section" id="status_card">
    <div class="cbi-section-node">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px">
            <strong style="font-size:1.1em"><%:Campus Network%></strong>
            <span id="shu_toggle_btn"></span>
        </div>
        <hr style="margin:0;opacity:0.3">
        <div style="padding:8px 12px 12px">
            <p id="shu_interface_info" style="margin:4px 0;min-height:1.4em"></p>
            <p id="shu_auth_info" style="margin:4px 0;min-height:1.4em"></p>
            <p id="shu_action_buttons" style="margin:4px 0 0;display:flex;gap:6px;flex-wrap:wrap"></p>
        </div>
    </div>
</div>

<script type="text/javascript">//<![CDATA[
var SHU_API = '<%=luci.dispatcher.build_url("admin","services","shucampus","api")%>';

function shuParse(x) {
    var text = x && x.responseText;
    if (!text) return null;
    try { return JSON.parse(text); } catch (e) { return null; }
}

function shuEsc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function shuFormatBytes(b) {
    if (!b) return '0 B';
    var bytes = parseInt(b, 10);
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
}

function shuCall(action, done) {
    XHR.get(SHU_API + '/' + action, null, function() {
        if (done) done();
        setTimeout(shuPollStatus, 1500);
    });
}

function shuToggle() {
    var state = window._shuEnabled ? '0' : '1';
    XHR.get(SHU_API + '/toggle?enabled=' + state, null, function() {
        window._shuEnabled = !window._shuEnabled;
        setTimeout(shuPollStatus, 1500);
    });
}

function shuLogin()   { shuCall('login'); }
function shuLogout()  { shuCall('logout'); }
function shuRestart() { shuCall('restart'); }

function shuRenderToggle(enabled) {
    if (enabled === '1') {
        return '<button class="cbi-button cbi-button-reset" style="min-width:60px" onclick="shuToggle()">' +
               '<%:Disable%>' + '</button>';
    }
    return '<button class="cbi-button cbi-button-apply" style="min-width:60px" onclick="shuToggle()">' +
           '<%:Enable%>' + '</button>';
}

function shuRenderInterface(iface) {
    if (!iface || !iface.ipv4) {
        return '<span style="color:#888"><%:Interface Offline%></span>';
    }
    var rx = shuFormatBytes(iface.rx_bytes);
    var tx = shuFormatBytes(iface.tx_bytes);
    return '<span style="color:green">' + shuEsc(iface.ipv4) + '</span>' +
           '  <span style="color:#666">\u2b07 ' + rx + '  \u2b06 ' + tx + '</span>';
}

function shuRenderAuth(s) {
    switch (s.state) {
    case 'online':
        return '<span style="color:green"><strong><%:Connected%></strong></span>' +
               (s.uptime ? ' <span style="color:#666">(' + s.uptime + ')</span>' : '');
    case 'authenticating':
        return '<span style="color:orange"><strong><%:Authenticating...%></strong></span>';
    case 'waiting':
        return '<span style="color:orange"><strong><%:Waiting for NAS...%></strong></span>';
    case 'auth_failed':
        return '<span style="color:red"><strong><%:Auth Failed%></strong>' +
               (s.state_msg ? ': ' + shuEsc(s.state_msg) : '') + '</span>';
    case 'offline':
        return '<span style="color:red"><strong><%:Offline%></strong></span>' +
               (s.state_msg ? ' <span style="color:#888">(' + shuEsc(s.state_msg) + ')</span>' : '');
    case 'disabled':
        return '<span style="color:#888"><strong><%:Disabled%></strong></span>';
    case 'stopped':
        return '<span style="color:#888"><strong><%:Not Running%></strong></span>';
    case 'suppressed':
        return '<span style="color:#888"><strong><%:Manually Disconnected%></strong></span>';
    case 'config_error':
        return '<span style="color:red"><strong><%:Config Incomplete%></strong></span>' +
               (s.state_msg ? ' <span style="color:#888">(' + shuEsc(s.state_msg) + ')</span>' : '');
    default:
        return '<span style="color:orange"><strong><%:Unknown%></strong></span>';
    }
}

function shuRenderActions(s) {
    var enabled = s.enabled === '1';
    var state = s.state;

    if (!enabled || state === 'disabled' || state === 'stopped') return '';

    switch (state) {
    case 'online':
        return '<button class="cbi-button cbi-button-apply" onclick="shuLogout()"><%:Disconnect%></button> ' +
               '<button class="cbi-button cbi-button-neutral" onclick="shuRestart()"><%:Restart%></button>';
    case 'suppressed':
    case 'auth_failed':
        return '<button class="cbi-button cbi-button-apply" onclick="shuLogin()"><%:Login Now%></button> ' +
               '<button class="cbi-button cbi-button-neutral" onclick="shuRestart()"><%:Restart%></button>';
    case 'config_error':
        return '';
    default:
        return '<button class="cbi-button cbi-button-neutral" onclick="shuRestart()"><%:Restart%></button>';
    }
}

function shuPollStatus() {
    XHR.get(SHU_API + '/status', null, function(x) {
        var s = shuParse(x);
        if (!s) return;

        window._shuEnabled = s.enabled === '1';

        var toggleEl = document.getElementById('shu_toggle_btn');
        if (toggleEl) toggleEl.innerHTML = shuRenderToggle(s.enabled);

        var authEl = document.getElementById('shu_auth_info');
        if (authEl) authEl.innerHTML = shuRenderAuth(s);

        var actionsEl = document.getElementById('shu_action_buttons');
        if (actionsEl) actionsEl.innerHTML = shuRenderActions(s);
    });

    XHR.get(SHU_API + '/ifstatus', null, function(x) {
        var iface = shuParse(x);
        var ifaceEl = document.getElementById('shu_interface_info');
        if (ifaceEl) ifaceEl.innerHTML = shuRenderInterface(iface);
    });
}

setTimeout(shuPollStatus, 300);
setInterval(shuPollStatus, 5000);
//]]></script>

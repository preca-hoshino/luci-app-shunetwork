<%#
Integrated status card: toggle, daemon state, interface info, auth state.
Each layer has its own status indicator and action buttons.
-%>

<div class="cbi-section" id="status_card">
    <div class="cbi-section-node">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px">
            <strong style="font-size:1.1em"><%:Campus Network%></strong>
            <span id="shu_toggle_btn"></span>
        </div>
        <div id="shu_card_body" style="padding:0 12px 10px">
            <p id="shu_daemon_row" style="margin:4px 0;display:flex;align-items:center;min-height:1.6em">
                <span id="shu_daemon_value"></span>
                <span id="shu_restart_btn" style="margin-left:auto"></span>
            </p>
            <p id="shu_iface_row" style="margin:4px 0;min-height:1.6em"></p>
            <p id="shu_auth_row" style="margin:4px 0;display:flex;align-items:center;min-height:1.6em">
                <span id="shu_auth_value"></span>
                <span id="shu_auth_btn" style="margin-left:auto"></span>
            </p>
        </div>
        <div id="shu_disabled_body" style="padding:0 12px 10px;display:none">
            <p style="margin:4px 0;color:#888"><%:Disabled%></p>
        </div>
    </div>
</div>

<script type="text/javascript">//<![CDATA[
var SHU_API = '<%=luci.dispatcher.build_url("admin","services","shucampus","api")%>';

function shuParse(x) {
    var text = x && x.responseText;
    if (!text) return null;
    try { return JSON.parse(text); } catch (e) { return null; }
}

function shuEsc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function shuFormatBytes(b) {
    if (!b) return '0 B';
    var bytes = parseInt(b, 10);
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
}

function shuCall(action, done) {
    XHR.get(SHU_API + '/' + action, null, function() {
        if (done) done();
        setTimeout(shuPollStatus, 1500);
    });
}

function shuToggle() {
    var state = window._shuEnabled ? '0' : '1';
    XHR.get(SHU_API + '/toggle?enabled=' + state, null, function() {
        window._shuEnabled = !window._shuEnabled;
        setTimeout(shuPollStatus, 1500);
    });
}

function shuLogin()   { shuCall('login'); }
function shuLogout()  { shuCall('logout'); }
function shuRestart() { shuCall('restart'); }

function shuDot(color) {
    return '<span style="color:' + color + '">\u25cf</span>';
}

function shuTime(s) {
    if (!s || !s.uptime) return '';
    var parts = s.uptime.split(' ');
    return parts.length > 1 ? parts[1] : s.uptime;
}

function shuRenderToggle(enabled) {
    if (enabled === '1') {
        return '<button class="cbi-button cbi-button-reset" style="min-width:60px" onclick="shuToggle()">' +
               '<%:Disable%>' + '</button>';
    }
    return '<button class="cbi-button cbi-button-apply" style="min-width:60px" onclick="shuToggle()">' +
           '<%:Enable%>' + '</button>';
}

function shuRenderDaemon(enabled, running) {
    if (enabled !== '1') {
        return shuDot('#888') + ' <span style="color:#888"><%:Daemon%> \u00b7 <%:Stopped%></span>';
    }
    if (running) {
        return shuDot('green') + ' <span style="color:green"><%:Daemon%> \u00b7 <%:Running%></span>';
    }
    return shuDot('red') + ' <span style="color:red"><%:Daemon%> \u00b7 <%:Stopped%></span>';
}

function shuRenderIface(iface) {
    if (!iface || !iface.ipv4) {
        return shuDot('#888') + ' <span style="color:#888"><%:Interface%> \u00b7 <%:Offline%></span>';
    }
    var rx = shuFormatBytes(iface.rx_bytes);
    var tx = shuFormatBytes(iface.tx_bytes);
    return shuDot('green') + ' <span style="color:green"><%:Interface%> \u00b7 ' + shuEsc(iface.ipv4) +
           '  \u2b07 ' + rx + '  \u2b06 ' + tx + '</span>';
}

function shuRenderAuth(s) {
    var state = s.state;
    switch (state) {
    case 'online':
        return shuDot('green') + ' <span style="color:green"><%:Auth%> \u00b7 <strong><%:Connected%></strong>' +
               ' (' + shuTime(s) + ')</span>';
    case 'authenticating':
        return shuDot('orange') + ' <span style="color:orange"><%:Auth%> \u00b7 <strong><%:Authenticating...%></strong></span>';
    case 'waiting':
        return shuDot('orange') + ' <span style="color:orange"><%:Auth%> \u00b7 <strong><%:Waiting for NAS...%></strong></span>';
    case 'auth_failed':
        return shuDot('red') + ' <span style="color:red"><%:Auth%> \u00b7 <strong><%:Auth Failed%></strong>' +
               (s.state_msg ? ': ' + shuEsc(s.state_msg) : '') + '</span>';
    case 'offline':
        return shuDot('red') + ' <span style="color:red"><%:Auth%> \u00b7 <strong><%:Offline%></strong></span>' +
               (s.state_msg ? ' (' + shuEsc(s.state_msg) + ')' : '');
    case 'suppressed':
        return shuDot('#888') + ' <span style="color:#888"><%:Auth%> \u00b7 <strong><%:Manually Disconnected%></strong></span>';
    case 'config_error':
        return shuDot('red') + ' <span style="color:red"><%:Auth%> \u00b7 <strong><%:Config Incomplete%></strong></span>' +
               (s.state_msg ? ' (' + shuEsc(s.state_msg) + ')' : '');
    default:
        return shuDot('#888') + ' <span style="color:#888"><%:Auth%> \u00b7 <strong><%:Unknown%></strong></span>';
    }
}

function shuRenderAuthBtn(s) {
    var state = s.state;
    if (s.enabled !== '1') return '';
    switch (state) {
    case 'online':
        return '<button class="cbi-button cbi-button-apply" onclick="shuLogout()"><%:Disconnect%></button>';
    case 'suppressed':
        return '<button class="cbi-button cbi-button-apply" onclick="shuLogin()"><%:Login Now%></button>';
    case 'auth_failed':
        return '<button class="cbi-button cbi-button-apply" onclick="shuLogin()"><%:Retry%></button>';
    case 'authenticating':
    case 'waiting':
    case 'offline':
        return '<button class="cbi-button cbi-button-neutral" onclick="shuRestart()"><%:Restart%></button>';
    default:
        return '';
    }
}

function shuPollStatus() {
    XHR.get(SHU_API + '/status', null, function(x) {
        var s = shuParse(x);
        if (!s) return;

        window._shuEnabled = s.enabled === '1';
        var enabled = s.enabled === '1';

        // Toggle button
        var toggleEl = document.getElementById('shu_toggle_btn');
        if (toggleEl) toggleEl.innerHTML = shuRenderToggle(s.enabled);

        // Show/hide body sections
        var bodyEl = document.getElementById('shu_card_body');
        var disabledEl = document.getElementById('shu_disabled_body');
        if (bodyEl) bodyEl.style.display = enabled ? '' : 'none';
        if (disabledEl) disabledEl.style.display = enabled ? 'none' : '';

        // Daemon row
        var daemonEl = document.getElementById('shu_daemon_value');
        if (daemonEl) daemonEl.innerHTML = shuRenderDaemon(s.enabled, s.daemon_running);

        var restartEl = document.getElementById('shu_restart_btn');
        if (restartEl) {
            restartEl.innerHTML = enabled
                ? '<button class="cbi-button cbi-button-neutral" onclick="shuRestart()"><%:Restart%></button>'
                : '';
        }

        // Auth row
        var authValEl = document.getElementById('shu_auth_value');
        if (authValEl) authValEl.innerHTML = shuRenderAuth(s);

        var authBtnEl = document.getElementById('shu_auth_btn');
        if (authBtnEl) authBtnEl.innerHTML = shuRenderAuthBtn(s);
    });

    XHR.get(SHU_API + '/ifstatus', null, function(x) {
        var iface = shuParse(x);
        var ifaceEl = document.getElementById('shu_iface_row');
        if (ifaceEl) ifaceEl.innerHTML = shuRenderIface(iface);
    });
}

setTimeout(shuPollStatus, 300);
setInterval(shuPollStatus, 5000);
//]]></script>

<%#
Log viewer page: textarea with scroll-to-tail/head buttons (tailscale-style).
-%>

<div style="padding-bottom:20px">
    <button class="cbi-button cbi-button-neutral" id="shu_btn_tail"><%:Scroll to tail%></button>
    <button class="cbi-button cbi-button-reset" onclick="shuClearLog()"><%:Clear Log%></button>
</div>

<textarea id="shu_log" readonly="readonly" wrap="off" rows="20"
    style="width:100%;font-size:12px"><%:Loading...%></textarea>

<div style="padding-bottom:20px">
    <button class="cbi-button cbi-button-neutral" id="shu_btn_head"><%:Scroll to head%></button>
</div>

<script type="text/javascript">//<![CDATA[
var SHU_LOG_URL   = '<%=luci.dispatcher.build_url("admin","services","shucampus","api","log")%>';
var SHU_CLEAR_URL = '<%=luci.dispatcher.build_url("admin","services","shucampus","api","log_clear")%>';

// tailscale-style: the two buttons jump the page between each other
document.getElementById('shu_btn_tail').addEventListener('click', function() {
    document.getElementById('shu_btn_head').scrollIntoView();
});
document.getElementById('shu_btn_head').addEventListener('click', function() {
    document.getElementById('shu_btn_tail').scrollIntoView();
});

function shuPollLog() {
    // LuCI XHR callback is cb(xhr, json, duration); json is only parsed
    // for application/json. For our text/plain endpoint read responseText.
    XHR.get(SHU_LOG_URL, null, function(x) {
        var text = (x && typeof x.responseText === 'string') ? x.responseText : '';
        var el = document.getElementById('shu_log');
        el.value = text.length ? text : '(empty)';
        var lines = text.trim().split(/\n/).length;
        el.rows = Math.min(lines + 1, 100);
    });
}

function shuClearLog() {
    XHR.get(SHU_CLEAR_URL, null, function() {
        shuPollLog();
    });
}

setTimeout(shuPollLog, 300);
setInterval(shuPollLog, 5000);
//]]></script>

<%#
Minimal status bar (tailscape-style): service name + RUNNING/NOT RUNNING,
with Restart and Enable/Disable buttons on the right.
Auth state is rendered into a DummyValue inside the CBI form.
-%>

<div class="cbi-section" id="status_bar">
    <div class="cbi-section-node">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px">
            <span id="shu_service_status"><em><%:Collecting data ...%></em></span>
            <span id="shu_status_buttons"></span>
        </div>
    </div>
</div>

<script type="text/javascript">//<![CDATA[
var SHU_API = '<%=luci.dispatcher.build_url("admin","services","shunetwork","api")%>';
var SHU_RETRY = 0;
var SHU_LAST_STATUS = null;
var SHU_LAST_IFACE = null;

function shuParse(x) {
    var text = x && x.responseText;
    if (!text || text.indexOf('<!') === 0) {
        console.warn('shuParse: empty or HTML response');
        return null;
    }
    try { return JSON.parse(text); } catch (e) {
        console.warn('shuParse: JSON parse error', e);
        return null;
    }
}

function shuEsc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function shuFormatBytes(b) {
    if (!b) return '0 B';
    var bytes = parseInt(b, 10);
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
}

// Progressive poll after an action: 1s, 2s, 4s, then back to normal 5s
function shuPollAfterAction(tryCount) {
    if (tryCount == null) tryCount = 0;
    shuPollStatus();
    if (tryCount < 3) {
        setTimeout(function() { shuPollAfterAction(tryCount + 1); },
                   1000 * Math.pow(2, tryCount));
    }
}

function shuCall(action, done) {
    XHR.get(SHU_API + '/' + action, null, function() {
        if (done) done();
        shuPollAfterAction(0);
    });
}

function shuToggle() {
    var state = window._shuEnabled ? '0' : '1';
    XHR.get(SHU_API + '/toggle?enabled=' + state, null, function() {
        window._shuEnabled = !window._shuEnabled;
        shuPollAfterAction(0);
    });
}

function shuLogin()   { shuCall('login'); }
function shuLogout()  { shuCall('logout'); }
function shuRestart() { shuCall('restart'); }

function shuDot(color) {
    return '<span style="color:' + color + '">\u25cf</span>';
}

function shuTime(s) {
    if (!s || !s.uptime) return '';
    var parts = s.uptime.split(' ');
    return parts.length > 1 ? parts[1] : s.uptime;
}

// ---- Status bar (top, always visible) ----

function shuRenderStatus(enabled, running) {
    var active = enabled === '1' && running;
    return shuDot(active ? 'green' : 'red') +
        ' <strong style="color:' + (active ? 'green' : 'red') + '">' +
        '<%:SHU Network%> \u00b7 ' +
        (active ? '<%:RUNNING%>' : '<%:NOT RUNNING%>') +
        '</strong>';
}

function shuRenderButtons(enabled) {
    var html = '<button class="cbi-button cbi-button-neutral" onclick="shuRestart()"><%:Restart%></button> ';
    if (enabled === '1') {
        html += '<button class="cbi-button cbi-button-reset" onclick="shuToggle()"><%:Disable%></button>';
    } else {
        html += '<button class="cbi-button cbi-button-apply" onclick="shuToggle()"><%:Enable%></button>';
    }
    return html;
}

// ---- Login status (inside CBI form as a DummyValue) ----

function shuRenderLogin(s) {
    var state = s.state;
    if (s.enabled !== '1') {
        return '<span style="color:#888"><%:Disabled%></span>';
    }
    switch (state) {
    case 'online':
        return shuDot('green') + ' <span style="color:green"><strong><%:Connected%></strong></span>' +
               (s.uptime ? ' <span style="color:#666">(' + shuTime(s) + ')</span>' : '') +
               ' <a style="color:green" href="javascript:shuLogout()"><%:Disconnect%></a>';
    case 'authenticating':
        return shuDot('orange') + ' <span style="color:orange"><strong><%:Authenticating...%></strong></span>';
    case 'waiting':
        return shuDot('orange') + ' <span style="color:orange"><strong><%:Waiting for NAS...%></strong></span>';
    case 'auth_failed':
        return shuDot('red') + ' <span style="color:red"><strong><%:Auth Failed%></strong>' +
               (s.state_msg ? ': ' + shuEsc(s.state_msg) : '') + '</span>' +
               ' <a style="color:red" href="javascript:shuLogin()"><%:Retry%></a>';
    case 'offline':
        return shuDot('red') + ' <span style="color:red"><strong><%:Offline%></strong></span>' +
               (s.state_msg ? ' <span style="color:#888">(' + shuEsc(s.state_msg) + ')</span>' : '') +
               ' <a href="javascript:shuLogin()"><%:Login Now%></a>';
    case 'suppressed':
        return shuDot('#888') + ' <span style="color:#888"><strong><%:Manually Disconnected%></strong></span>' +
               ' <a href="javascript:shuLogin()"><%:Login Now%></a>';
    case 'config_error':
        return shuDot('red') + ' <span style="color:red"><strong><%:Config Incomplete%></strong></span>' +
               (s.state_msg ? ' <span style="color:#888">(' + shuEsc(s.state_msg) + ')</span>' : '');
    default:
        return shuDot('orange') + ' <span style="color:orange"><strong><%:Unknown%></strong></span>';
    }
}

// ---- Interface info (inside CBI form as a DummyValue) ----

function shuRenderIface(iface) {
    if (!iface || !iface.ipv4) {
        return shuDot('red') + ' <span style="color:red"><%:Disabled%></span>';
    }
    var rx = shuFormatBytes(iface.rx_bytes);
    var tx = shuFormatBytes(iface.tx_bytes);
    return shuDot('green') + ' <span style="color:green"><%:Enabled%></span>' +
           ' \u00b7 ' + shuEsc(iface.ipv4) +
           '  \u2b07 ' + rx + '  \u2b06 ' + tx;
}

function shuPollStatus() {
    XHR.get(SHU_API + '/status', null, function(x) {
        var s = shuParse(x);
        if (!s) {
            SHU_RETRY++;
            if (SHU_RETRY > 2 && SHU_LAST_STATUS) {
                s = SHU_LAST_STATUS;
            }
            return;
        }
        SHU_RETRY = 0;
        SHU_LAST_STATUS = s;

        window._shuEnabled = s.enabled === '1';

        var statusEl = document.getElementById('shu_service_status');
        if (statusEl) statusEl.innerHTML = shuRenderStatus(s.enabled, s.daemon_running);

        var btnEl = document.getElementById('shu_status_buttons');
        if (btnEl) btnEl.innerHTML = shuRenderButtons(s.enabled);

        var loginEl = document.getElementById('shu_login_status');
        if (loginEl) loginEl.innerHTML = shuRenderLogin(s);
    });

    XHR.get(SHU_API + '/ifstatus', null, function(x) {
        var iface = shuParse(x);
        if (!iface) {
            if (SHU_LAST_IFACE) iface = SHU_LAST_IFACE;
            return;
        }
        SHU_LAST_IFACE = iface;
        var ifaceEl = document.getElementById('shu_iface_value');
        if (ifaceEl) ifaceEl.innerHTML = shuRenderIface(iface);
    });
}

function shuStartPolling() {
    shuPollStatus();
    setTimeout(function() {
        if (!SHU_LAST_STATUS) shuPollStatus();
    }, 1000);
    setTimeout(function() {
        if (!SHU_LAST_STATUS) shuPollStatus();
    }, 3000);
    setInterval(shuPollStatus, 5000);
}

shuStartPolling();
//]]></script>

<%#
Interface info page: pure read-only network data table (tailscale-style).
No action buttons here.
-%>

<div id="shu_ifinfo"><em><%:Loading...%></em></div>

<script type="text/javascript">//<![CDATA[
var SHU_IF_URL = '<%=luci.dispatcher.build_url("admin","services","shunetwork","api","ifstatus")%>';

function shuParse(x) {
    var text = x && x.responseText;
    if (!text) return null;
    try { return JSON.parse(text); } catch (e) { return null; }
}

function shuFmtBytes(b) {
    b = Number(b) || 0;
    if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
    if (b >= 1048576)    return (b / 1048576).toFixed(2) + ' MB';
    if (b >= 1024)       return (b / 1024).toFixed(2) + ' KB';
    return b + ' B';
}

function shuEsc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function shuRow(label, value) {
    return '<tr class="tr"><td class="td left" width="25%">' + label + '</td>' +
           '<td class="td left" width="25%">' + shuEsc(value || '-') + '</td></tr>';
}

function shuRenderIfinfo(s) {
    var el = document.getElementById('shu_ifinfo');
    if (!s || !s.name) {
        el.innerHTML = '<div><%:No interface online.%></div>';
        return;
    }
    el.innerHTML =
        '<table class="table">' +
        '<tr class="tr"><th class="th" colspan="2"><%:Network Interface Information%></th></tr>' +
        shuRow('<%:Interface Name%>', s.name) +
        shuRow('<%:IPv4 Address%>', s.ipv4) +
        shuRow('<%:MTU%>', s.mtu) +
        shuRow('<%:Total Download%>', shuFmtBytes(s.rx_bytes)) +
        shuRow('<%:Total Upload%>', shuFmtBytes(s.tx_bytes)) +
        '</table>';
}

function shuPollIfinfo() {
    XHR.get(SHU_IF_URL, null, function(x) {
        shuRenderIfinfo(shuParse(x));
    });
}

setTimeout(shuPollIfinfo, 300);
setInterval(shuPollIfinfo, 5000);
//]]></script>

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .ipk
        run: |
          chmod +x ipk-build.sh
          ./ipk-build.sh

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename ipk with tag version
        run: |
          mv luci-app-shucampus_*.ipk "luci-app-shucampus_${{ steps.version.outputs.tag }}_all.ipk"

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: "luci-app-shucampus v${{ steps.version.outputs.tag }}"
          body_path: .github/release-body.md
          fail_on_unmatched_files: true
          files: |
            luci-app-shucampus_*.ipk
